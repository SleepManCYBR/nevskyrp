    var m10 = n % 10, m100 = n % 100, w = "правил";

    else if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) w = "правила";
    return n + " " + w;
  }

  var list = $("#list"), chips = $("#chips"), empty = $("#empty"), input = $("#q"), toast = $("#toast");
  var state = { c: "all", q: "" };

  /* ---------- Рендер ---------- */
  chips.innerHTML =
    '<button class="chip" type="button" data-c="all" aria-pressed="true">Все статьи</button>' +
    A.map(function (a) {
      return '<button class="chip" type="button" data-c="' + a.n + '" aria-pressed="false">' + esc(a.s) + "</button>";
    }).join("");

  list.innerHTML = A.map(function (a) {
    var cards = a.r.map(function (r) {
      return '<button class="card glass rv" type="button" data-copy="' +
        esc(r[0] + " " + r[1] + ". " + r[2] + " Наказание: " + r[3]) + '">' +
        '<span class="c-top"><span class="c-code">' + esc(r[0]) + '</span>' +
        '<svg class="ic c-copy" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-copy"/></svg></span>' +
        '<span class="c-title">' + esc(r[1]) + "</span>" +
        '<span class="c-desc">' + esc(r[2]) + "</span>" +
        '<span class="c-pen' + (r[4] ? " hard" : "") + '">' + esc(r[3]) + "</span></button>";
    }).join("");
    return '<article class="article" id="art' + a.n + '" data-n="' + a.n + '">' +
      '<header class="a-head rv"><span class="a-icon glass"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-' + a.i + '"/></svg></span>' +
      '<div><div class="a-num">Статья ' + a.n + '</div><h2 class="a-title">' + esc(a.t) + "</h2></div>" +
      '<span class="a-count">' + plural(a.r.length) + "</span></header>" +
      '<div class="grid">' + cards + "</div></article>";
  }).join("");

  var articles = Array.prototype.map.call(list.querySelectorAll(".article"), function (el, idx) {
    var cards = Array.prototype.map.call(el.querySelectorAll(".card"), function (c) {
      return { el: c, txt: c.textContent.toLowerCase() };
    });
    return { el: el, n: A[idx].n, cards: cards, count: el.querySelector(".a-count") };
  });

  /* ---------- Фильтры ---------- */
  function swap() {
    var items = list.querySelectorAll(".rv.in.done:not([hidden])");
    Array.prototype.forEach.call(items, function (el, i) {
      el.style.setProperty("--d", Math.min(i * 0.03, 0.4) + "s");
      el.classList.remove("swap");
      void el.offsetWidth;
      el.classList.add("swap");
    });
  }

  function apply() {
    var q = state.q.trim().toLowerCase(), total = 0;
    articles.forEach(function (a) {
      var vis = 0;
      a.cards.forEach(function (c) {
        var ok = (state.c === "all" || state.c === a.n) && (!q || c.txt.indexOf(q) > -1);
        c.el.hidden = !ok;
        if (ok) vis++;
      });
      a.el.hidden = !vis;
      if (vis) a.count.textContent = plural(vis);
      total += vis;
    });
    empty.hidden = total > 0;
    swap();
  }

  function setChip(c) {
    state.c = c;
    Array.prototype.forEach.call(chips.children, function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-c") === String(c)));
    });
  }

  chips.addEventListener("click", function (e) {
    var b = e.target.closest(".chip");
    if (!b) return;
    var v = b.getAttribute("data-c");
    state.q = ""; input.value = "";
    setChip(v === "all" ? "all" : Number(v));
    apply();
    if (v !== "all") list.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  input.addEventListener("input", function () {
    state.q = input.value;
    setChip("all");
    apply();
  });

  Array.prototype.forEach.call(document.querySelectorAll('.links a[href^="#art"]'), function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      var id = a.getAttribute("href").slice(1);
      state.q = ""; input.value = "";
      setChip("all"); apply();
      requestAnimationFrame(function () {
        var t = document.getElementById(id);
        if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
  });

  /* ---------- Копирование ---------- */
  var toastTimer;
  function showToast() {
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1800);
  }
  function copy(text) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(fallback);
    } else { fallback(); }
    showToast();
  }

  list.addEventListener("click", function (e) {
    var c = e.target.closest(".card");
    if (c) copy(c.getAttribute("data-copy"));
  });

  /* Подсветка под курсором */
  list.addEventListener("pointermove", function (e) {
    var c = e.target.closest(".card");
    if (!c) return;
    var r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px");
    c.style.setProperty("--my", (e.clientY - r.top) + "px");
  });

  /* Завершение анимации появления */
  list.addEventListener("animationend", function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains("rv")) {
      t.classList.add("done");
      t.classList.remove("swap");
      t.style.removeProperty("--d");
    }
  });

  /* ---------- Появление блоков при прокрутке ---------- */
  function startReveal() {
    var els = list.querySelectorAll(".rv");
    if (!("IntersectionObserver" in window)) {
      Array.prototype.forEach.call(els, function (el) { el.classList.add("in", "done"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      var i = 0;
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        en.target.style.setProperty("--d", Math.min(i++ * 0.06, 0.42) + "s");
        en.target.classList.add("in");
        io.unobserve(en.target);
      });
    }, { rootMargin: "0px 0px -6% 0px", threshold: 0.06 });
    Array.prototype.forEach.call(els, function (el) { io.observe(el); });
  }

  /* ---------- Интро ---------- */
  var intro = $("#intro"), finished = false;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function finish() {
    if (finished) return;
    finished = true;
    intro.classList.add("out");
    document.body.classList.remove("lock");
    document.body.classList.add("ready");
    startReveal();
    setTimeout(function () { intro.remove(); }, 1300);
  }

  if (reduce) { finish(); }
  else {
    setTimeout(finish, 2500);
    intro.addEventListener("click", finish);
  }
})();
</script>
</body>
</html>
