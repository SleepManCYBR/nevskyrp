      "<div>" + (num ? '<div class="a-num">Статья ' + a.n + "</div>" : "") + '<h2 class="a-title">' + esc(a.t) + "</h2></div>" +
      (a.r.length > 1 ? '<span class="a-count">' + plural(a.r.length) + "</span>" : "") + "</header>" +
      '<div class="grid">' + a.r.map(cardHtml).join("") + "</div></article>";
  });
  list.innerHTML = html;

  var partEls = Array.prototype.slice.call(list.querySelectorAll(".part"));
  var articles = Array.prototype.map.call(list.querySelectorAll(".article"), function (el) {
    var cards = Array.prototype.map.call(el.querySelectorAll(".card"), function (c) {
      return { el: c, txt: c.textContent.toLowerCase() };
    });
    return { el: el, a: byId[el.getAttribute("data-n")], cards: cards, count: el.querySelector(".a-count") };
  });

  /* ---------- Фильтры ---------- */
  function swap() {
    var items = list.querySelectorAll(".rv.in.done:not([hidden])");
    Array.prototype.forEach.call(items, function (el, i) {
      el.style.setProperty("--d", Math.min(i * 0.03, 0.4) + "s");
      el.classList.remove("swap");
      void el.offsetWidth;
      el.classList.add("swap");
    });
  }
  function inScope(a) {
    var c = state.c;
    if (c === "all") return true;
    if (c === "p1") return a.p === 1;
    if (c === "p2") return a.p === 2;
    return String(a.n) === c;
  }
  function apply() {
    var q = state.q.trim().toLowerCase(), total = 0, vp = { 1: 0, 2: 0 };
    articles.forEach(function (x) {
      var vis = 0;
      x.cards.forEach(function (c) {
        var ok = inScope(x.a) && (!q || c.txt.indexOf(q) > -1);
        c.el.hidden = !ok;
        if (ok) vis++;
      });
      x.el.hidden = !vis;
      if (vis && x.count) x.count.textContent = plural(vis);
      vp[x.a.p] += vis;
      total += vis;
    });
    partEls.forEach(function (el) { el.hidden = !vp[el.getAttribute("data-p")]; });
    empty.hidden = total > 0;
    swap();
  }

  function onChip(e) {
    var b = e.target.closest(".chip");
    if (!b) return;
    state.q = ""; input.value = "";
    setState(b.getAttribute("data-c"));
    apply();
    if (state.c !== "all") $(".filters").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  chips.addEventListener("click", onChip);
  sub.addEventListener("click", onChip);

  input.addEventListener("input", function () {
    state.q = input.value;
    setState("all");
    apply();
  });

  Array.prototype.forEach.call(document.querySelectorAll('.links a[href^="#art"]'), function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      var id = a.getAttribute("href").slice(1);
      state.q = ""; input.value = "";
      setState("all"); apply();
      requestAnimationFrame(function () {
        var t = document.getElementById(id);
        if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
  });

  /* ---------- Хедер: плавающая плашка и подсветка раздела ---------- */
  var linksBox = $("#links"), pill = $(".pill", linksBox);
  var navLinks = Array.prototype.slice.call(linksBox.querySelectorAll("a")), activeLink = null;

  function place(a) {
    if (!a) { pill.style.opacity = 0; return; }
    pill.style.opacity = 1;
    pill.style.width = a.offsetWidth + "px";
    pill.style.transform = "translateX(" + a.offsetLeft + "px)";
  }
  navLinks.forEach(function (a) {
    a.addEventListener("mouseenter", function () { place(a); });
    a.addEventListener("focus", function () { place(a); });
  });
  linksBox.addEventListener("mouseleave", function () { place(activeLink); });

  var spyRaf = 0;
  function spy() {
    spyRaf = 0;
    var cur = null;
    navLinks.forEach(function (a) {
      var t = document.getElementById(a.getAttribute("href").slice(1));
      if (t && !t.hidden && t.getBoundingClientRect().top <= 170) cur = a;
    });
    if (cur !== activeLink) {
      if (activeLink) activeLink.classList.remove("on");
      activeLink = cur;
      if (cur) cur.classList.add("on");
      place(cur);
    }
  }
  window.addEventListener("scroll", function () {
    if (!spyRaf) spyRaf = requestAnimationFrame(spy);
  }, { passive: true });

  $("#navSearch").addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
    setTimeout(function () { input.focus({ preventScroll: true }); }, 450);
  });

  /* ---------- Копирование ---------- */
  var toastTimer;
  function showToast() {
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1800);
  }
  function copy(text) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(fallback);
    } else { fallback(); }
    showToast();
  }
  list.addEventListener("click", function (e) {
    var c = e.target.closest(".card");
    if (c) copy(c.getAttribute("data-copy"));
  });

  /* Подсветка под курсором (throttle через rAF) */
  var pmRaf = 0, pmEv = null;
  list.addEventListener("pointermove", function (e) {
    pmEv = e;
    if (pmRaf) return;
    pmRaf = requestAnimationFrame(function () {
      pmRaf = 0;
      var c = pmEv.target.closest && pmEv.target.closest(".card");
      if (!c) return;
      var r = c.getBoundingClientRect();
      c.style.setProperty("--mx", (pmEv.clientX - r.left) + "px");
      c.style.setProperty("--my", (pmEv.clientY - r.top) + "px");
    });
  }, { passive: true });

  /* Завершение анимации появления */
  list.addEventListener("animationend", function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains("rv")) {
      t.classList.add("done");
      t.classList.remove("swap");
      t.style.removeProperty("--d");
    }
  });

  /* ---------- Появление блоков при прокрутке ---------- */
  function startReveal() {
    var els = list.querySelectorAll(".rv");
    if (!("IntersectionObserver" in window)) {
      Array.prototype.forEach.call(els, function (el) { el.classList.add("in", "done"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      var i = 0;
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        en.target.style.setProperty("--d", Math.min(i++ * 0.06, 0.42) + "s");
        en.target.classList.add("in");
        io.unobserve(en.target);
      });
    }, { rootMargin: "0px 0px -6% 0px", threshold: 0.06 });
    Array.prototype.forEach.call(els, function (el) { io.observe(el); });
  }

  /* ---------- Интро ---------- */
  var intro = $("#intro"), finished = false;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function finish() {
    if (finished) return;
    finished = true;
    intro.classList.add("out");
    document.body.classList.remove("lock");
    document.body.classList.add("ready");
    startReveal();
    setTimeout(function () { intro.remove(); }, 1300);
  }

  if (reduce) { finish(); }
  else {
    setTimeout(finish, 2500);
    intro.addEventListener("click", finish);
  }
})();
</script>
</body>
</html>
